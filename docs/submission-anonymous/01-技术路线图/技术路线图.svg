<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700"><rect width="1040" height="700" fill="#f5f7fc"/><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203452} .box{fill:white;stroke:#2f55d4;stroke-width:2}.arrow{stroke:#2f55d4;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2f55d4"/></marker></defs><text x="50" y="55" font-size="28" font-weight="bold">教智星 · 教学智能体技术路线</text><text x="50" y="86" font-size="15">教师审定贯穿课前、课中、课后与实践教学</text><rect class="box" x="50" y="120" width="940" height="86" rx="12"/><text x="75" y="152" font-size="20">教师 Web 工作台</text><text x="75" y="181" font-size="16">教案 · 课件提纲 · 案例 · 组卷 · 评阅 · 学情 · 实训</text><path class="arrow" d="M520 208V240"/><rect class="box" x="50" y="244" width="440" height="110" rx="12"/><text x="75" y="277" font-size="20">结构化草稿与独立子台对话</text><text x="75" y="305" font-size="16">Zustand / 浏览器草稿按 workspaceIdentity 分区</text><text x="75" y="331" font-size="16">教师确认应用、编辑、撤销、导出</text><rect class="box" x="550" y="244" width="440" height="110" rx="12"/><text x="575" y="277" font-size="20">HTTP / WebSocket Server</text><text x="575" y="305" font-size="16">限时口令鉴权 · 同源 HttpOnly Cookie</text><text x="575" y="331" font-size="16">到期拒绝请求及断开连接</text><path class="arrow" d="M770 356V390"/><rect class="box" x="550" y="394" width="440" height="102" rx="12"/><text x="575" y="427" font-size="20">既有 Agent Runtime（会话唯一所有者）</text><text x="575" y="457" font-size="16">owner/lease · CommandInbox · 流式/恢复</text><path class="arrow" d="M550 446H493"/><rect class="box" x="50" y="394" width="440" height="102" rx="12"/><text x="75" y="427" font-size="20">七类教学 Skills + 配置的模型供应商</text><text x="75" y="457" font-size="16">生成初稿与建议，教师复核后用于课堂</text><path class="arrow" d="M270 498V535"/><rect class="box" x="50" y="539" width="940" height="88" rx="12"/><text x="75" y="572" font-size="20">课程工作区：脱敏大纲 / 知识点 / 汇总学情 / 产物文件</text><text x="75" y="600" font-size="16">文件系统持有生成产物；建设时间线与材料清单辅助审核，不替代真实课堂证据</text><text x="50" y="665" font-size="16">部署：阿里云 Docker 单容器测试 · 仅受信评审 · 不挂载生产数据 · 尚需云上验证与学校盖章</text></svg>